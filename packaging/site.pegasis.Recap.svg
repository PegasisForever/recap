<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4552"/>
      <stop offset="1" stop-color="#242a33"/>
    </linearGradient>
  </defs>

  <!-- monitor body -->
  <rect x="10" y="20" width="108" height="72" rx="8" fill="url(#screen)"/>
  <rect x="10" y="20" width="108" height="72" rx="8" fill="none"
        stroke="#151a21" stroke-width="3"/>

  <!-- stand -->
  <rect x="54" y="92" width="20" height="12" fill="#2c333d"/>
  <rect x="38" y="102" width="52" height="8" rx="4" fill="#2c333d"/>

  <!-- record dot -->
  <circle cx="64" cy="56" r="19" fill="#e0322e"/>
  <circle cx="64" cy="56" r="19" fill="none" stroke="#ff6b62"
          stroke-width="2" opacity="0.7"/>
</svg>
