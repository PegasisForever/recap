app-id: site.pegasis.Recap
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: recap

# The GNOME 50 platform already carries ffmpeg 7.1.3 with libx264 and libopus,
# ffprobe, gdbus, pw-record and pw-dump, so the only program that has to be
# built here is the recorder itself.
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Encoding. Without a render node gpu-screen-recorder falls back to libx264
  # on the CPU, which still works but costs far more.
  - --device=dri

  # Audio capture talks to the host PipeWire daemon directly. Screen capture
  # does not need this: the portal hands back its own PipeWire file descriptor.
  - --filesystem=xdg-run/pipewire-0
  - --socket=pulseaudio

  # Uploading to S3.
  - --share=network

finish-args-comment: >-
  Screen capture needs no extra permission. xdg-desktop-portal is reachable
  from inside every sandbox by default, and it is the only path recap uses.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: gpu-screen-recorder
    buildsystem: meson
    config-opts:
      - -Dportal=true
      # setcap on a file being installed into the build root cannot work and
      # fails the build. KMS capture is what needs the capability, and recap
      # only ever asks for portal capture.
      - -Dcapabilities=false
      # Both install host configuration that a sandbox has no use for: a user
      # systemd unit and an nvidia modprobe drop-in.
      - -Dsystemd=false
      - -Dnvidia_suspend_fix=false
    sources:
      - type: git
        url: https://repo.dec05eba.com/gpu-screen-recorder.git
        commit: 9c2c0e1d0de9b3968415b08830a45f64091d3b98
    cleanup:
      # KMS capture needs a setuid helper, which a sandbox cannot have. Portal
      # capture is what recap asks for, so the helper is dead weight.
      - /bin/gsr-kms-server

  - name: recap
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/recap/cargo
      build-args:
        # Lets cargo fetch crates during the build. Flathub forbids this and
        # wants a generated cargo-sources.json instead. Self-hosting does not,
        # and skipping the generator keeps the manifest readable.
        - --share=network
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/recap /app/bin/recap
      - install -Dm644 packaging/site.pegasis.Recap.desktop
        /app/share/applications/site.pegasis.Recap.desktop
      - install -Dm644 packaging/site.pegasis.Recap.metainfo.xml
        /app/share/metainfo/site.pegasis.Recap.metainfo.xml
      - install -Dm644 packaging/site.pegasis.Recap.svg
        /app/share/icons/hicolor/scalable/apps/site.pegasis.Recap.svg
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - .flatpak-builder
          - build
